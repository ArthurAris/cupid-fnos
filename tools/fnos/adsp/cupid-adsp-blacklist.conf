# Suppress alias/udev autoload only; explicit `modprobe pmic_glink` remains allowed.
# The optional cupid-adsp.service orders custom ADSP/QRTR/PDM binding checks before
# pmic_glink and validates real battery attributes. Aux presence is not readiness;
# neither module loading nor driver binding proves a locator/service handshake.
# Every disabled/wrong-env/safe/error path attempts a bounded standard-module
# fallback while holding the shared lock; unavailable/unsafe lock forbids loads.
# ExecStopPost handles failed/timeout starts. Kernel-hang recovery is not guaranteed;
# no forced unload/rebind is attempted.
# Module name is pmic_glink; qcom_pmic_glink is its platform driver name.
# Revert by removing this blacklist and disabling the optional unit in deployment.
blacklist pmic_glink
